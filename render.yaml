services:
  - type: web
    name: cyberlord-domain-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_ENABLED
        value: "false"
      - key: PAYMENT_ADMIN_TOKEN
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
      - key: BSC_RPC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: KALI_WORKER_URL
        sync: false
      - key: KALI_WORKER_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

  - type: worker
    name: cyberlord-monitoring-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
