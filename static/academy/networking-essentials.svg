<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" role="img" aria-label="TCP: a conversation UDP: postcards" class="academy-img">
<rect width="100%" height="100%" rx="14" fill="#0b1220"/>
<text x="320" y="40" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle">TCP: a conversation UDP: postcards</text>
<rect x="40" y="56" width="560" height="2" rx="1" fill="#32d6a0"/>
<rect x="60" y="84" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="108" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Client sends SYN</text>
<text x="320" y="128" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">wants to talk</text>
<line x1="320" y1="138" x2="320" y2="154" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,154 326,154 320,165" fill="#32d6a0"/>
<rect x="60" y="166" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="190" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Server replies SYN-ACK</text>
<text x="320" y="210" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">agrees and picks a sequence</text>
<line x1="320" y1="220" x2="320" y2="236" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,236 326,236 320,247" fill="#32d6a0"/>
<rect x="60" y="248" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="272" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Client sends ACK</text>
<text x="320" y="292" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">connection open</text>
<line x1="320" y1="302" x2="320" y2="318" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,318 326,318 320,329" fill="#32d6a0"/>
<rect x="60" y="330" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="354" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Data flows both ways</text>
<text x="320" y="374" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">ordered, retransmitted if lost</text>
<line x1="320" y1="384" x2="320" y2="400" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,400 326,400 320,411" fill="#32d6a0"/>
<rect x="60" y="412" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="436" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">FIN exchange</text>
<text x="320" y="456" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">both sides close cleanly</text>
<text x="320" y="514" fill="#7e8ea8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">TCP is reliable and ordered. UDP skips all of this: fire-and-send.</text>
</svg>