<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" role="img" aria-label="Handling evidence properly" class="academy-img">
<rect width="100%" height="100%" rx="14" fill="#0b1220"/>
<text x="320" y="40" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Handling evidence properly</text>
<rect x="40" y="56" width="560" height="2" rx="1" fill="#32d6a0"/>
<rect x="60" y="84" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="108" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Capture first</text>
<text x="320" y="128" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">images, logs, screenshots, memory</text>
<line x1="320" y1="138" x2="320" y2="154" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,154 326,154 320,165" fill="#32d6a0"/>
<rect x="60" y="166" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="190" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Hash everything</text>
<text x="320" y="210" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">SHA-256 proves nothing changed since</text>
<line x1="320" y1="220" x2="320" y2="236" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,236 326,236 320,247" fill="#32d6a0"/>
<rect x="60" y="248" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="272" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Chain of custody</text>
<text x="320" y="292" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">who held it, when, and why</text>
<line x1="320" y1="302" x2="320" y2="318" stroke="#32d6a0" stroke-width="2"/>
<polygon points="314,318 326,318 320,329" fill="#32d6a0"/>
<rect x="60" y="330" width="520" height="54" rx="10" fill="#101a2e" stroke="#32d6a0" stroke-width="1.5"/>
<text x="320" y="354" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Work on copies</text>
<text x="320" y="374" fill="#9fb0c8" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">never analyse the original</text>
<text x="320" y="432" fill="#7e8ea8" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Evidence you cannot prove you kept is evidence you do not have.</text>
</svg>